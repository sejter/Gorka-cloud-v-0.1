server {
    listen 80;
    server_name _;

    # Максимальный размер загружаемой картинки
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Главная панель управления (ПК / мобильная админка)
    location = / {
        try_files /index.html =404;
    }

    # Страница просмотра по QR-коду (Read-Only для телефона)
    location ~ ^/v/([a-zA-Z0-9_-]+)$ {
        try_files /view.html =404;
    }

    # Прямая раздача картинок через Nginx
    location /raw/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Проксирование запросов к FastAPI
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
