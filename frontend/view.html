<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Просмотр файла — Gorka-cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0F172A] text-white min-h-screen flex flex-col justify-between">

  <!-- Шапка -->
  <header class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/80 backdrop-blur">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-[#0061FE] flex items-center justify-center">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
          <path d="M5 19L10.5 10L14.5 16L17 12.5L21 19H5Z" fill="white"/>
        </svg>
      </div>
      <span class="font-bold text-sm tracking-tight">Gorka-cloud</span>
    </div>
    <span class="text-[11px] px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
      Только просмотр
    </span>
  </header>

  <!-- Область просмотра картинки -->
  <main class="flex-1 flex items-center justify-center p-4 overflow-auto">
    <div id="loading" class="text-slate-400 text-sm">Загрузка изображения...</div>

    <div id="errorBox" class="hidden text-center p-6 bg-slate-900 rounded-2xl border border-slate-800 max-w-sm">
      <p class="text-base font-semibold text-red-400 mb-1">Файл не найден</p>
      <p class="text-xs text-slate-400">Возможно, ссылка устарела или картинка была удалена владельцем.</p>
    </div>

    <img id="previewImage" src="" alt=""
      class="hidden max-h-[72vh] max-w-full object-contain rounded-xl shadow-2xl border border-slate-800" />
  </main>

  <!-- Нижняя панель с информацией и кнопкой скачивания -->
  <footer id="footerBar" class="hidden p-4 bg-slate-900 border-t border-slate-800">
    <div class="max-w-md mx-auto flex flex-col gap-3">
      <div class="flex justify-between items-center text-xs">
        <span id="fileName" class="font-medium text-slate-200 truncate pr-4"></span>
        <span id="fileMeta" class="text-slate-400 shrink-0"></span>
      </div>
      <a id="downloadBtn" href="#"
        class="w-full bg-[#0061FE] active:bg-[#0051D5] text-white font-semibold text-sm py-3.5 rounded-xl flex items-center justify-center gap-2 shadow-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
        Скачать оригинал
      </a>
    </div>
  </footer>

  <script>
    function formatBytes(bytes) {
      if (!bytes) return '0 Б';
      const k = 1024, sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    async function initViewer() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const imgId = parts[parts.length - 1];

      const res = await fetch(`/api/public/${imgId}`);
      document.getElementById('loading').classList.add('hidden');

      if (!res.ok) {
        document.getElementById('errorBox').classList.remove('hidden');
        return;
      }

      const data = await res.json();
      const imgEl = document.getElementById('previewImage');
      imgEl.src = `/raw/${data.stored_name}`;
      imgEl.alt = data.orig_name;
      imgEl.classList.remove('hidden');

      document.getElementById('fileName').textContent = data.orig_name;
      document.getElementById('fileMeta').textContent = formatBytes(data.size);
      document.getElementById('downloadBtn').href = `/api/download/${data.id}`;
      document.getElementById('footerBar').classList.remove('hidden');
    }

    initViewer();
  </script>
</body>
</html>
