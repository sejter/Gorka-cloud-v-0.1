services:
  backend:
    build: ./backend
    container_name: gorka_backend
    restart: unless-stopped
    environment:
      - ADMIN_PIN=1234                 # Пароль для входа в панель управления с ПК
      - STORAGE_QUOTA_GB=15            # Лимит места под картинки (из ваших 20 ГБ)
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/db:/app/db
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    container_name: gorka_nginx
    restart: unless-stopped
    ports:
      - "80:80"                        # При необходимости измените внешний порт, например "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./data/uploads:/usr/share/nginx/uploads:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
